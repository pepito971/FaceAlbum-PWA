
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>FaceAlbum</title>
<link rel="manifest" href="./manifest.webmanifest">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      text-align: center;
      padding: 30px 15px;
    }
    h1 { color: #2457a7; }
    button {
      background: #2457a7;
      color: white;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>📸 FaceAlbum</h1>
  <p>Organise tes photos par personne.</p>

  <input type="file"
         id="photos"
         accept="image/*"
         multiple>

  <p id="message">Aucune photo sélectionnée.</p>

<button id="analyser" type="button">
  🔍 Analyser les photos
</button>

<h3>📸 Photos sélectionnées</h3>
<div id="apercu" style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;"></div>
<script src="./detection.js"></script>
  <script>
    document.getElementById("photos")
      .addEventListener("change", function () {
const count = this.files.length;
        const apercu = document.getElementById("apercu");
apercu.innerHTML = "";

for (const photo of this.files) {
    const image = document.createElement("img");
    const url = URL.createObjectURL(photo);

    image.src = url;
    image.style.width = "100px";
    image.style.height = "100px";
    image.style.objectFit = "cover";
    image.style.borderRadius = "10px";

    image.onload = () => URL.revokeObjectURL(url);
    apercu.appendChild(image);
}
        document.getElementById("message")
          .textContent = count + " photo(s) sélectionnée(s).";
      });

document.getElementById("analyser")
.addEventListener("click", async function () {


    const photos = document.getElementById("photos").files;
    const resultat = document.getElementById("resultat");

    if (photos.length === 0) {
      resultat.textContent = "Sélectionne d'abord des photos.";
      return;
    }

    
resultat.textContent = "Analyse en cours...";

try {
  let totalVisages = 0;

  for (const photo of photos) {
    const analyse = await detecterVisages(photo);
    totalVisages += analyse.nombre;
  }

  resultat.textContent =
    totalVisages + " visage(s) détecté(s) dans " +
    photos.length + " photo(s).";
} catch (erreur) {
  resultat.textContent =
    "Erreur d'analyse : " + erreur.message;
}

  });

  </script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js")
        .catch(error => {
          console.error("Service Worker :", error);
        });
    });
  }
</script>


</body>
</html>
